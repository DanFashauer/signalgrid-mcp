# claude.yml — the GitHub-side trigger of the SignalGrid brain for this repository
# (Review-Hub DR-063, proposed: triggers = the Claude GitHub App + the Mac). When the
# OWNER writes `@claude` in a comment, review or issue, Claude Code runs on GitHub's
# runner in this checkout, reads CLAUDE.md (PR #16 — merge it first), and answers in
# the thread or pushes a branch for a fix. The Mac keeps the hardware checks: real
# macOS runs of the tools happen there, never on this runner.
#
# Shape the owner chose on 2026-10-02 ("Full workflow"), as reviewed (Opus, same day):
# - The job runs only for the owner's own account (job-level `if`): a stranger's
#   `@claude` never starts a runner. The action also requires a human actor with write
#   access; automation posting as the owner that happens to contain the phrase is the
#   one accepted cost (a run that exits at the trigger check costs runner minutes).
# - Only the owner's own comments reach the prompt (`include_comments_by_actor`).
# - Claude's writes go through the Claude GitHub App's own installation token, which
#   the action mints itself; the WORKFLOW token below is read-only on contents.
# - "Never merges" rests on the action's tool allowlist at this pin (no `gh`, pushes
#   only `origin <ref>`), not on permissions — keep `claude_args` free of Bash/`gh`
#   grants. Branch protection on main is the owner's hardening on top.
# - Every run is bounded by --max-turns. The action is pinned to the v1 commit; it
#   installs the Claude Code CLI by pinned VERSION at run time (version-pinned, not
#   content-pinned).
# - The model side authenticates with the owner's subscription through
#   CLAUDE_CODE_OAUTH_TOKEN, a repository secret the OWNER mints with
#   `claude setup-token`. Until it exists, a mention starts a run that posts its
#   tracking comment, installs the CLI, then fails the environment check and edits
#   that comment with the error: visible, and nothing is pushed.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      github.actor == 'DanFashauer' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read # Claude's own pushes use the App token; this token only checks out
      pull-requests: write # fallback for the action's buffered review comments
      issues: write # same, on issues
      id-token: write # exchanged for the Claude App installation token
      actions: read # Claude reads CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@97c53473391bff1901034d4b454b5bac7ab7a029 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          include_comments_by_actor: DanFashauer
          claude_args: |
            --model claude-opus-5-5
            --max-turns 50
